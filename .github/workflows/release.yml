name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.97.0'

jobs:
  # The full CI (type check, front end tests, core crate tests, clippy, rustfmt,
  # and the Windows app and platform tests) on the tagged commit. A tag can
  # point at a commit CI never saw (CI runs only on main and pull requests), so
  # the release runs it itself instead of trusting an earlier run.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows:
    name: Windows installer and portable exe
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Read the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$version" != "$app_version" ]; then
            echo "::error::Tag $TAG does not match version $app_version in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install npm packages
        run: npm ci

      # Pinned to the toolchain every local check ran on (rustc 1.97.0). A new
      # stable release can add clippy lints that fail -D warnings on an unrelated
      # push (Rust 1.98.0 did, 2026-10-01). Raise RUST_TOOLCHAIN deliberately.
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      # Builds the front end (beforeBuildCommand), the release exe with its
      # pages embedded, and the NSIS installer. No updater, no signing.
      # Arguments after `--` go to cargo: `--locked` fails the build when
      # Cargo.lock does not match Cargo.toml, as in CI, instead of resolving a
      # new dependency graph on the runner.
      - name: Build
        run: npx tauri build --bundles nsis -- --locked

      - name: Collect the files and their checksums
        run: |
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected one NSIS installer, found ${#installers[@]}"
            exit 1
          fi
          exe=target/release/idea-keystage.exe
          [ -f "$exe" ] || exe=src-tauri/target/release/idea-keystage.exe
          if [ ! -f "$exe" ]; then
            echo "::error::idea-keystage.exe was not built"
            exit 1
          fi
          mkdir -p release
          cp "${installers[0]}" "release/IDEA-Keystage_${VERSION}_x64-setup.exe"
          cp "$exe" "release/IDEA-Keystage_${VERSION}_x64-portable.exe"
          cd release
          sha256sum -b IDEA-Keystage_*.exe | sed 's/ \*/  /' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - name: Release notes
        run: sed "s/{{VERSION}}/${VERSION}/g" scripts/release-notes.md > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/upload-artifact@v7
        with:
          name: idea-keystage-${{ env.VERSION }}-release
          path: release/
          if-no-files-found: error
          retention-days: 14

      # Re-running this job replaces the files of an existing release.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          files=(release/IDEA-Keystage_*.exe release/SHA256SUMS.txt)
          notes="$RUNNER_TEMP/release-notes.md"
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "IDEA Keystage $VERSION" --notes-file "$notes"
          else
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --verify-tag \
              --title "IDEA Keystage $VERSION" --notes-file "$notes" "${prerelease[@]}"
          fi
