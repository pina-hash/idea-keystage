[package]
name = "idea-keystage"
description = "IDEA Keystage: keystroke, keyboard and mouse visualizer for SolidWorks tutorial recording."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
default-run = "idea-keystage"

[lib]
name = "idea_keystage_lib"
crate-type = ["rlib"]

[[bin]]
name = "idea-keystage"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
keystage-core.workspace = true
keystage-session.workspace = true
keystage-server.workspace = true
keystage-obs.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-opener.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
crossbeam-queue.workspace = true
parking_lot.workspace = true
base64.workspace = true
rodio.workspace = true

[target.'cfg(windows)'.dependencies]
# Owned by the Windows platform layer (src/platform). Each feature is listed
# with the APIs that need it; see .work/research/windows.md for the sources.
windows = { workspace = true, features = [
    "Win32_Foundation",                 # HWND, HANDLE, LocalFree, CloseHandle
    "Win32_UI_WindowsAndMessaging",     # hooks, message loops, window styles, WinEvent constants
    "Win32_UI_Input_KeyboardAndMouse",  # GetAsyncKeyState, ToUnicodeEx, MapVirtualKeyExW, GetLastInputInfo
    "Win32_System_Threading",           # OpenProcess, QueryFullProcessImageNameW, GetCurrentThreadId
    "Win32_System_LibraryLoader",       # GetModuleHandleW (hook hMod)
    "Win32_System_SystemInformation",   # GetTickCount64, OSVERSIONINFOW
    "Wdk_System_SystemServices",        # RtlGetVersion (real build number without a compatibility manifest)
    "Win32_UI_Accessibility",           # SetWinEventHook, UI Automation IsPassword
    "Win32_System_Com",                 # CoInitializeEx, CoCreateInstance (UI Automation)
    "Win32_System_RemoteDesktop",       # WTSRegisterSessionNotification
    "Win32_Graphics_Gdi",               # EnumDisplayMonitors, GetMonitorInfoW, RegisterClassExW gate
    "Win32_Devices_Display",            # QueryDisplayConfig, DisplayConfigGetDeviceInfo (monitor names)
    "Win32_UI_HiDpi",                   # GetDpiForMonitor, GetDpiForWindow
    "Win32_UI_Shell",                   # SetWindowSubclass (overlay style guard)
    "Win32_Security",                   # OpenProcessToken gate, TOKEN_ELEVATION
    "Win32_Security_Cryptography",      # CryptProtectData, CryptUnprotectData
] }
# Needed as a direct dependency for #[windows::core::implement] (the UI Automation
# focus handler); same version as the windows crate.
windows-core.workspace = true
